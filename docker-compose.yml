# DSIC-2906 minimum viable lakehouse: MinIO + Iceberg + Spark + Trino.
#
#   cp .env.example .env
#   docker compose --env-file .env up -d
#
# Airflow OPSIONAL (profil `orchestration`). README: jika tidak stabil dalam
# 1-2 hari pertama, pakai scripts/ + Makefile.
#
# Semua image di-pin. Verifikasi ketersediaan tag saat E0, lalu salin versi
# persisnya ke docs/reproducibility.md (gate: same Trino configuration,
# same hardware/resource cap).

name: dsic2906

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./volumes/minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPUS}"
          memory: ${MINIO_MEMORY}

  # Membuat bucket raw zone + warehouse sekali jalan, lalu keluar.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc ls local/${MINIO_BUCKET}
      "
    restart: "no"

  # Katalog Iceberg bersama. Spark (writer Bronze/Silver/Gold) dan Trino
  # (reader B0/B1/B2/P1) WAJIB melihat metadata tabel yang sama, karena gate
  # penelitian mensyaratkan keempat policy memakai snapshot identik.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports: ["8181:8181"]
    environment:
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${MINIO_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  trino:
    image: trinodb/trino:476
    depends_on:
      - iceberg-rest
    ports: ["8080:8080"]
    volumes: ["./infra/trino/catalog:/etc/trino/catalog:ro"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "${TRINO_CPUS}"
          memory: ${TRINO_MEMORY}

  spark:
    image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    depends_on:
      - iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
    volumes:
      - "./:/workspace:rw"
    working_dir: /workspace
    command: ["sleep", "infinity"]
    deploy:
      resources:
        limits:
          cpus: "${SPARK_CPUS}"
          memory: ${SPARK_MEMORY}

  # Opsional. Tidak ikut `up` default:
  #   docker compose --env-file .env --profile orchestration up -d airflow
  airflow:
    profiles: ["orchestration"]
    image: apache/airflow:2.10.5
    depends_on:
      - spark
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    volumes:
      - "./infra/airflow:/opt/airflow/dags:ro"
    ports: ["8081:8080"]
    command: ["standalone"]
