# Trino Iceberg connector.
#
# iceberg.catalog.type=hadoop TIDAK didukung Trino. Nilai yang sah:
# hive_metastore | glue | jdbc | rest | nessie | snowflake.
#
# REST dipilih karena Spark (writer Bronze/Silver/Gold) dan Trino (reader
# B0/B1/B2/P1) wajib melihat snapshot Iceberg yang sama persis - gate
# penelitian mensyaratkan keempat policy berjalan di atas snapshot identik.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:ICEBERG_CATALOG_URI}
iceberg.rest-catalog.warehouse=${ENV:ICEBERG_WAREHOUSE}

fs.native-s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# Jangan aktifkan caching selama benchmark latency tanpa mencatatnya sebagai
# bagian dari environment freeze.
